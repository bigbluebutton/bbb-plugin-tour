name: Dependencies - audit production packages
on: [pull_request]

permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Merge branches
        uses: ./.github/actions/merge-branches
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: audit the packages shipped in the bundle
        run: npm audit --omit=dev
